services:
  db:
    image: postgres:17-alpine
    container_name: ruang-layanan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ruang_layanan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ruang_layanan_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ruang_layanan"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ruang_layanan_data:
